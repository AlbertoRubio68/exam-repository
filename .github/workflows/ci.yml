name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: exam-app

jobs:
  quality:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: exam-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:ci

      - name: Build de producción
        run: npm run build

      - name: Publicar artefacto de build
        uses: actions/upload-artifact@v7
        with:
          name: exam-app-dist
          path: exam-app/dist/exam-app/browser
          retention-days: 7
          if-no-files-found: error
