<div class="flex h-dvh flex-col overflow-hidden bg-slate-100 text-slate-900">
  <!-- Cabecera del examen -->
  <header class="z-10 shrink-0 border-b border-slate-200 bg-white shadow-sm">
    <div
      class="flex flex-col gap-1 px-4 py-3 sm:px-6 lg:flex-row lg:items-center lg:justify-between"
    >
      <div class="min-w-0">
        <p class="text-xs font-semibold uppercase tracking-wide text-sky-700">
          Qüestionari interactiu
        </p>
        <h1 class="truncate text-base font-semibold text-slate-900 sm:text-lg" [title]="exam.title">
          {{ exam.title }}
        </h1>
        <p class="truncate text-xs text-slate-500">
          {{ exam.examId }} · {{ totalQuestions }} preguntes
        </p>
      </div>
      <span
        class="hidden shrink-0 items-center gap-2 rounded-full bg-sky-50 px-3 py-1 text-xs font-medium text-sky-800 lg:inline-flex"
      >
        <span class="h-2 w-2 rounded-full bg-sky-500"></span>
        Vista dividida 50/50
      </span>
    </div>

    <!-- Pestañas de navegación: solo en móvil / tablet -->
    <nav
      class="grid grid-cols-2 border-t border-slate-200 text-sm font-medium lg:hidden"
      aria-label="Canvi de vista"
    >
      <button
        type="button"
        data-testid="tab-questions"
        class="flex items-center justify-center gap-2 border-b-2 px-4 py-2.5 transition-colors"
        [class]="
          view() === 'questions'
            ? 'border-sky-600 bg-slate-50 text-sky-700'
            : 'border-transparent text-slate-500 hover:text-slate-700'
        "
        [attr.aria-pressed]="view() === 'questions'"
        (click)="showQuestions()"
      >
        Preguntes
      </button>
      <button
        type="button"
        data-testid="tab-pdf"
        class="flex items-center justify-center gap-2 border-b-2 px-4 py-2.5 transition-colors"
        [class]="
          view() === 'pdf'
            ? 'border-sky-600 bg-slate-50 text-sky-700'
            : 'border-transparent text-slate-500 hover:text-slate-700'
        "
        [attr.aria-pressed]="view() === 'pdf'"
        (click)="showPdf()"
      >
        Temari PDF
      </button>
    </nav>
  </header>

  <!-- Split-screen: 50/50 en escritorio, una columna por pestaña en móvil -->
  <main class="min-h-0 flex-1 lg:grid lg:grid-cols-2 lg:divide-x lg:divide-slate-200">
    <section
      data-testid="pane-questions"
      class="h-full min-h-0"
      [class.pane--collapsed]="view() !== 'questions'"
      aria-label="Preguntes"
    >
      <app-question-panel
        [questions]="exam.questions"
        [index]="currentIndex()"
        (indexChange)="selectQuestion($event)"
      />
    </section>

    <section
      data-testid="pane-pdf"
      class="h-full min-h-0"
      [class.pane--collapsed]="view() !== 'pdf'"
      aria-label="Temari PDF"
    >
      <app-pdf-viewer [pdfUrl]="exam.pdfUrl" />
    </section>
  </main>
</div>
